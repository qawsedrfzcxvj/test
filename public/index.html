<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>シンプル大富豪</title>
<style>
  * { box-sizing: pointer-events; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0c0c0c; color: #f0f0f0; margin: 0; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; height: 100dvh; overflow: hidden; }
  h2 { margin: 2px 0; font-size: 1.1rem; color: #ddd; }
  .box { background: #1a1a1a; border: 1px solid #333; padding: 8px; border-radius: 8px; width: 100%; max-width: 450px; text-align: center; margin-bottom: 6px; }
  
  /* スマホで押しやすく大きくしたカードデザイン */
  .card { background: #fff; color: #111; border-radius: 6px; width: 52px; height: 76px; display: flex; flex-direction: column; justify-content: space-between; padding: 5px; font-weight: bold; cursor: pointer; user-select: none; border: 1px solid #ccc; font-size: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.4); touch-action: manipulation; transition: transform 0.1s; }
  .card:active { transform: scale(0.95); }
  .card.red { color: #d32f2f; }
  .card.selected { transform: translateY(-16px); border-color: #ffd700; background: #fffde7; box-shadow: 0 6px 12px rgba(255,215,0,0.4); }

  /* 場札エリア */
  #field { min-height: 85px; display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; }
  
  /* 手札エリア（大きくスクロールしやすく） */
  .hand-container { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; max-height: 180px; overflow-y: auto; padding: 8px 2px; }
  
  /* ボタン（スマホで押しやすいようタップ領域を拡大） */
  button { background: #2e7d32; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1.05rem; font-weight: bold; touch-action: manipulation; }
  button:hover { background: #388e3c; }
  button:disabled { background: #444; color: #888; cursor: not-allowed; }
  .btn-pass { background: #c62828; }
  .btn-pass:hover { background: #d32f2f; }

  /* プレイヤーリスト */
  .players-list { display: flex; justify-content: space-around; font-size: 0.8rem; width: 100%; max-width: 450px; margin-bottom: 4px; gap: 4px; }
  .player-item { padding: 4px 6px; border-radius: 4px; background: #1a1a1a; border: 1px solid #333; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-item.active { border-color: #4caf50; color: #4caf50; background: #112e12; font-weight: bold; }

  input[type="text"] { padding: 10px; font-size: 1rem; border-radius: 6px; border: 1px solid #444; background: #222; color: #fff; width: 100%; margin-bottom: 8px; }
  
  .notice { font-size: 0.75rem; color: #ffeb3b; margin-top: 4px; }
</style>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; width:100%;">
    <div class="box" style="max-width:320px; padding: 20px;">
      <h2>大富豪オンライン</h2>
      <p style="font-size:0.8rem; color:#aaa; margin-bottom:12px;" id="roomInfoText">ルーム参加</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <input type="text" id="roomInput" placeholder="ルームID (例: room1)" maxlength="20">
        <input type="text" id="nameInput" placeholder="プレイヤー名" maxlength="10">
        <button onclick="joinGame()" style="width:100%;">入室する</button>
      </div>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-screen" style="display:none; width:100%; max-width:450px; flex-direction:column; align-items:center; height:100%;">
    <div style="display:flex; justify-content:space-between; width:100%; align-items:center; padding: 0 4px;">
      <h2>大富豪</h2>
      <span id="currentRoomDisplay" style="font-size:0.75rem; color:#888;"></span>
    </div>
    
    <div class="players-list" id="playersList"></div>

    <!-- 待機中のホスト用スタートボタン -->
    <div id="host-controls" class="box" style="display:none; background: #222; border-color: #555;">
      <p style="margin: 0 0 8px 0; font-size: 0.8rem;">あなたがホストです。メンバーが揃ったらスタートしてください。</p>
      <button id="btnStart" onclick="startGame()" style="width:100%;">ゲームスタート</button>
    </div>

    <!-- 場札 -->
    <div class="box">
      <div style="font-size:0.75rem; color:#888; margin-bottom:2px;">場札</div>
      <div id="field"><span style="color:#666; font-size:0.85rem;">場は流れています</span></div>
      <div id="noticeArea" class="notice"></div>
    </div>

    <!-- 手札・操作エリア -->
    <div class="box" style="flex-grow:1; display:flex; flex-direction:column; justify-content:space-between; margin-bottom:0;">
      <div>
        <div style="font-size:0.75rem; color:#888; margin-bottom:2px;">あなたの手札 (タップして選択)</div>
        <div id="hand" class="hand-container"></div>
      </div>
      <div style="margin-top:8px; display:flex; gap:10px; justify-content:center;">
        <button id="btnPlay" onclick="playCards()" style="flex:1;" disabled>出す</button>
        <button id="btnPass" class="btn-pass" onclick="passTurn()" style="flex:1;" disabled>パス</button>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let myHand = [];
  let selectedIndices = new Set();
  let isMyTurn = false;
  let activeRoom = 'default';

  // URLのパスから自動でルーム名を取得 (例: /roomA -> roomA)
  window.addEventListener('DOMContentLoaded', () => {
    const pathSegments = window.location.pathname.split('/').filter(Boolean);
    if (pathSegments.length > 0) {
      activeRoom = pathSegments[pathSegments.length - 1];
      document.getElementById('roomInput').value = activeRoom;
      document.getElementById('roomInfoText').innerText = `ルーム: ${activeRoom}`;
    } else {
      document.getElementById('roomInput').value = 'default';
    }
  });

  function joinGame() {
    const name = document.getElementById('nameInput').value.trim();
    const roomInputVal = document.getElementById('roomInput').value.trim();
    if (!name) return alert('プレイヤー名を入力してください');
    if (roomInputVal) activeRoom = roomInputVal;

    socket.emit('join', { roomName: activeRoom, name: name });
    
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'flex';
    document.getElementById('currentRoomDisplay').innerText = `Room: ${activeRoom}`;
  }

  function startGame() {
    socket.emit('start-game');
  }

  socket.on('alert', (msg) => {
    alert(msg);
  });

  socket.on('updateState', (state) => {
    const pList = document.getElementById('playersList');
    pList.innerHTML = state.players.map((p, idx) => 
      `<div class="player-item ${state.gameStarted && idx === state.turnIndex ? 'active' : ''}">
        ${p.isHost ? '👑' : ''}${p.name} (${p.cardCount})
      </div>`
    ).join('');

    const hostControls = document.getElementById('host-controls');
    if (!state.gameStarted && state.isHost) {
      hostControls.style.display = 'block';
    } else {
      hostControls.style.display = 'none';
    }

    const field = document.getElementById('field');
    if (state.field.length === 0) {
      field.innerHTML = '<span style="color:#666; font-size:0.85rem;">場は流れています</span>';
    } else {
      field.innerHTML = state.field.map(c => renderCardHtml(c)).join('');
    }

    const noticeArea = document.getElementById('noticeArea');
    if (state.needsSpade3) {
      noticeArea.innerText = '※ 最初は「♠3」を含めて出してください';
    } else {
      noticeArea.innerText = '';
    }

    myHand = state.hand || [];
    selectedIndices.clear();
    renderHand();

    isMyTurn = state.isMyTurn;
    document.getElementById('btnPlay').disabled = !isMyTurn;
    document.getElementById('btnPass').disabled = !isMyTurn;
  });

  function renderCardHtml(card) {
    const suits = { S: '♠', H: '♥', D: '♦', C: '♣' };
    const numMap = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K', 14: '2' };
    const numStr = numMap[card.num] || card.num;
    const isRed = card.suit === 'H' || card.suit === 'D';
    return `<div class="card ${isRed ? 'red' : ''}">
      <span style="font-size:0.85rem;">${numStr}</span>
      <span style="align-self:center; font-size:1.4rem;">${suits[card.suit]}</span>
      <span style="align-self:flex-end; font-size:0.85rem;">${numStr}</span>
    </div>`;
  }

  function renderHand() {
    const handDiv = document.getElementById('hand');
    handDiv.innerHTML = myHand.map((card, idx) => {
      const suits = { S: '♠', H: '♥', D: '♦', C: '♣' };
      const numMap = { 1: 'A', 11: 'J', 12: 'Q', 13: 'K', 14: '2' };
      const numStr = numMap[card.num] || card.num;
      const isRed = card.suit === 'H' || card.suit === 'D';
      const isSelected = selectedIndices.has(idx);
      return `<div class="card ${isRed ? 'red' : ''} ${isSelected ? 'selected' : ''}" onclick="toggleSelect(${idx})">
        <span style="font-size:0.85rem;">${numStr}</span>
        <span style="align-self:center; font-size:1.4rem;">${suits[card.suit]}</span>
        <span style="align-self:flex-end; font-size:0.85rem;">${numStr}</span>
      </div>`;
    }).join('');
  }

  function toggleSelect(idx) {
    if (!isMyTurn) return;
    if (selectedIndices.has(idx)) {
      selectedIndices.delete(idx);
    } else {
      selectedIndices.add(idx);
    }
    renderHand();
  }

  function playCards() {
    const indices = Array.from(selectedIndices);
    if (indices.length === 0) return;
    socket.emit('playCards', indices);
  }

  function passTurn() {
    socket.emit('pass');
  }
</script>
</body>
</html>
